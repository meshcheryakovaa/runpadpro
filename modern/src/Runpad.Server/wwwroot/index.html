<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Runpad Pro — класс</title>
<style>:root{color-scheme:dark;font:15px Segoe UI,Arial;background:#101823;color:#e8eef6}*{box-sizing:border-box}body{margin:0}header{padding:20px 24px;border-bottom:1px solid #304052;display:flex;align-items:center;gap:20px;flex-wrap:wrap}h1{margin:0;font-size:23px}header span{color:#9cadc3}button,input,select{font:inherit;padding:9px 12px;border:1px solid #40556b;border-radius:7px;background:#1b2b3c;color:inherit}button{cursor:pointer}button:hover{background:#29435b}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:14px 24px;position:sticky;top:0;background:#101823;z-index:2}main{padding:4px 24px 24px}#grid{display:grid;grid-template-columns:repeat(var(--columns,6),minmax(0,1fr));gap:10px}.card{border:1px solid #34455b;border-radius:10px;overflow:hidden;background:#172331}.card.selected{border-color:#61ccb5;box-shadow:0 0 0 1px #61ccb5}.screen{aspect-ratio:16/9;background:#080e16;display:flex;align-items:center;justify-content:center;color:#8292a8;position:relative}.screen img{width:100%;height:100%;object-fit:contain}.meta{padding:10px;display:flex;justify-content:space-between;gap:8px}.small{font-size:12px;color:#9fb0c7}.dot{color:#63d6b6}.offline{color:#e39880}#error{color:#ffb3a7;padding:0 24px}dialog{background:#172331;color:inherit;border:1px solid #45586f;border-radius:12px;max-width:560px;padding:25px}dialog::backdrop{background:#0009}dialog label{display:block;margin:12px 0}dialog input{width:100%}#activity{margin-top:24px;color:#adbed3}details summary{cursor:pointer}a{color:#8bdccb}#login{max-width:480px;margin:10vh auto;padding:26px;background:#172331;border-radius:12px}#login input{width:100%;margin:12px 0}.hidden{display:none!important}</style></head>
<body><section id="login"><h1>Runpad Pro</h1><p>Панель преподавателя</p><label>Токен администратора<input id="token" type="password" autocomplete="off"></label><button id="connect">Подключиться</button><p class="small">Токен хранится только в памяти этой вкладки.</p><p id="loginError"></p></section>
<div id="app" class="hidden"><header><h1>RUNPAD PRO</h1><span>Управление компьютерным классом</span><button id="logout">Выйти</button></header>
<div class="toolbar"><select id="classroom"><option value="">Все классы</option></select><details><summary>Компьютеры</summary><div id="computers"></div></details><button id="all">Выбрать все видимые</button><label>Обновление <input id="interval" type="number" min="1000" max="300000" value="3000" style="width:100px"> мс</label></div>
<div class="toolbar"><button data-command="lock">Заблокировать</button><button data-command="open-url">Открыть сайт</button><button data-command="message">Сообщение</button><button id="sendFile">Передать файл</button><button data-command="shutdown">Выключить</button><button data-command="restart">Перезагрузить</button><button data-command="cancel-shutdown">Отменить выключение</button><span id="count" class="small"></span></div>
<p id="error" role="alert"></p><main><div id="grid"></div><details id="activity"><summary>Результаты команд</summary><div id="results"></div></details></main></div>
<input id="file" type="file" hidden>
<script>
'use strict';let secret='',devices=[],selected=new Set(),excluded=new Set(),timer,refreshing=false;const $=id=>document.getElementById(id);
async function api(path,options={}){const headers=new Headers(options.headers||{});headers.set('Authorization','Bearer '+secret);if(options.body&&!(options.body instanceof FormData))headers.set('Content-Type','application/json');const r=await fetch('/api/admin/'+path,{...options,headers,cache:'no-store'});if(!r.ok)throw Error(r.status===401?'Неверный токен или доступ отозван':'Ошибка сервера '+r.status);return r.status===204?null:r.json()}
$('connect').onclick=async()=>{secret=$('token').value;try{devices=await api('devices');$('token').value='';$('login').classList.add('hidden');$('app').classList.remove('hidden');await refresh()}catch(e){$('loginError').textContent=e.message;secret=''}};
$('logout').onclick=()=>{secret='';clearTimeout(timer);$('grid').replaceChildren();$('app').classList.add('hidden');$('login').classList.remove('hidden')};
function visible(){return devices.filter(d=>(!$('classroom').value||d.classroom===$('classroom').value)&&!excluded.has(d.id))}
function text(tag,value,cls){let e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e}
function render(){let grid=$('grid');grid.replaceChildren();for(const d of visible()){const card=text('article','','card'+(selected.has(d.id)?' selected':''));let screen=text('div','','screen');if(d.screen&&d.screenAt&&Date.now()-new Date(d.screenAt).getTime()<20000){let img=new Image();img.alt='Экран '+d.name;img.src='data:image/jpeg;base64,'+d.screen;screen.append(img)}else screen.textContent='Нет свежего изображения';const meta=text('div','','meta'),left=text('div','');left.append(text('strong',d.name),text('div',(d.user||'Пользователь не подключён')+' · '+d.classroom,'small'));let cb=document.createElement('input');cb.type='checkbox';cb.checked=selected.has(d.id);cb.setAttribute('aria-label','Выбрать '+d.name);cb.onchange=()=>{cb.checked?selected.add(d.id):selected.delete(d.id);render()};meta.append(left,cb);const online=d.userSeenAt&&Date.now()-new Date(d.userSeenAt).getTime()<20000;let state=text('div',online?'● Подключён':'● Нет пользовательского агента','meta small '+(online?'dot':'offline'));card.append(screen,meta,state);grid.append(card)}$('count').textContent='Выбрано: '+visible().filter(d=>selected.has(d.id)).length+' / '+visible().length;fitGrid()}
function fitGrid(){const n=visible().length,w=$('grid').clientWidth,h=Math.max(200,innerHeight-$('grid').getBoundingClientRect().top-45),max=Math.max(1,Math.min(n,12,Math.floor(w/125)));let columns=Math.max(1,Math.min(n,Math.floor(w/190)));for(let c=1;c<=max;c++){let rows=Math.ceil(n/c),width=(w-10*(c-1))/c;if(rows*(width*9/16+85)+10*(rows-1)<=h){columns=c;break}}$('grid').style.setProperty('--columns',columns)}
addEventListener('resize',fitGrid);
function rebuildFilters(){let old=$('classroom').value;let options=[text('option','Все классы')];options[0].value='';for(let c of [...new Set(devices.map(d=>d.classroom))].sort()){let o=text('option',c);o.value=c;options.push(o)}$('classroom').replaceChildren(...options);$('classroom').value=old;const box=$('computers');box.replaceChildren();for(let d of devices){let label=text('label','');label.style.display='block';let cb=document.createElement('input');cb.type='checkbox';cb.checked=!excluded.has(d.id);cb.onchange=()=>{cb.checked?excluded.delete(d.id):excluded.add(d.id);render()};label.append(cb,document.createTextNode(' '+d.name));box.append(label)}}
async function refresh(){if(!secret||refreshing)return;refreshing=true;try{devices=await api('devices');rebuildFilters();render();if($('activity').open){let rows=await api('commands');$('results').replaceChildren(...rows.map(c=>text('p',c.command.kind+' · '+(devices.find(d=>d.id===c.deviceId)?.name||c.deviceId)+' · '+(c.result?(c.result.ok?'выполнено':c.result.error):new Date(c.command.expiresAt)<new Date()?'истекло':'ожидает выполнения'),'small')))}$('error').textContent=''}catch(e){$('error').textContent=e.message}finally{refreshing=false;clearTimeout(timer);if(secret)timer=setTimeout(refresh,Math.max(1000,Math.min(300000,Number($('interval').value)||3000)))}}
$('classroom').onchange=render;$('interval').onchange=()=>{clearTimeout(timer);refresh()};$('all').onclick=()=>{let list=visible(),all=list.every(d=>selected.has(d.id));for(let d of list)all?selected.delete(d.id):selected.add(d.id);render()};
async function command(kind,payload={}){let ids=visible().filter(d=>selected.has(d.id)).map(d=>d.id);if(!ids.length){alert('Выберите компьютеры');return}if(['shutdown','restart','lock'].includes(kind)&&!confirm('Выполнить «'+kind+'» на '+ids.length+' компьютерах?'))return;try{await api('commands',{method:'POST',body:JSON.stringify({deviceIds:ids,kind,payload})});$('activity').open=true;await refresh()}catch(e){$('error').textContent=e.message}}
for(let b of document.querySelectorAll('[data-command]'))b.onclick=()=>{let kind=b.dataset.command,payload={};if(kind==='open-url'){let url=prompt('Адрес сайта (https://...)');if(!url)return;payload={url}}if(kind==='message'){let value=prompt('Сообщение преподавателя');if(!value)return;payload={text:value}}command(kind,payload)};
$('sendFile').onclick=()=>{if(!visible().some(d=>selected.has(d.id))){alert('Выберите компьютеры');return}$('file').click()};$('file').onchange=async()=>{let file=$('file').files[0];if(!file)return;if(file.size>50000000){alert('Максимум 50 МБ');return}try{let form=new FormData();form.append('file',file);let uploaded=await api('files',{method:'POST',body:form});await command('file',{fileId:uploaded.fileId,name:uploaded.name})}catch(e){$('error').textContent=e.message}finally{$('file').value=''}};
</script></body></html>
