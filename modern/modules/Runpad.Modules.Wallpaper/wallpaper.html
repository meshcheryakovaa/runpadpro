<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Runpad Pro</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:radial-gradient(ellipse at 80% 20%,#33615c,transparent 60%),#101d2d;color:#edf7f3;min-height:100vh;padding:34px 48px;display:flex;align-items:center;justify-content:space-between}small{color:#9fbbc4;letter-spacing:3px}h1{font-size:42px;margin:8px 0;font-weight:500}#clock{font-size:54px;font-weight:300;text-align:right}#date{color:#bad0d4;text-align:right}</style>
<div><small>ВАШЕ РАБОЧЕЕ ПРОСТРАНСТВО</small><h1>Runpad Pro</h1><span>Программы, учебные материалы и инструменты класса</span></div><div><div id="clock"></div><div id="date"></div></div>
<script>function tick(){let d=new Date();clock.textContent=d.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});date.textContent=d.toLocaleDateString('ru',{day:'numeric',month:'long',weekday:'long'})}tick();setInterval(tick,1000)</script></html>
